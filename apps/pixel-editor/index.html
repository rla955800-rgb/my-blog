<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도트 그림판</title>
  <meta name="description" content="16×16 칸에 도트를 찍어 그리고 PNG로 저장하는 픽셀 아트 에디터.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
  <script>
    // 블로그에서 고른 테마를 첫 화면 전에 적용해 깜빡임을 막는다
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="ui.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">도트 그림판</h1>
    </header>

    <main class="app-main">
      <div class="toolbar">
        <div class="tool-group" role="group" aria-label="도구">
          <button type="button" class="tool-button" data-tool="pencil" aria-pressed="true" aria-label="연필" title="연필 (P)" aria-keyshortcuts="P">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>
            <span class="button-label">연필</span>
          </button>
          <button type="button" class="tool-button" data-tool="eraser" aria-pressed="false" aria-label="지우개" title="지우개 (E)" aria-keyshortcuts="E">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 15l9-9 7 7-6 6H8z"/><path d="M9 10l7 7"/><path d="M14 19h6"/></svg>
            <span class="button-label">지우개</span>
          </button>
          <button type="button" class="tool-button" data-tool="fill" aria-pressed="false" aria-label="채우기" title="채우기 (F)" aria-keyshortcuts="F">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12l7-7 7 7-7 7z"/><path d="M4 12h14"/><path d="M20 15c1 1.5 1.5 2.5 1.5 3.2a1.5 1.5 0 01-3 0c0-.7.5-1.7 1.5-3.2z"/></svg>
            <span class="button-label">채우기</span>
          </button>
          <button type="button" class="tool-button" data-tool="picker" aria-pressed="false" aria-label="스포이드" title="스포이드 (I)" aria-keyshortcuts="I">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 6l4 4"/><path d="M16 4l4 4-2 2-4-4z"/><path d="M15 9l-8 8-3 1 1-3 8-8"/></svg>
            <span class="button-label">스포이드</span>
          </button>
        </div>

        <div class="edit-group" role="group" aria-label="편집">
          <button type="button" class="tool-button" id="undo" aria-label="되돌리기" title="되돌리기 (Ctrl+Z)" aria-keyshortcuts="Control+Z Meta+Z" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
          </button>
          <button type="button" class="tool-button" id="redo" aria-label="다시하기" title="다시하기 (Ctrl+Shift+Z)" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
          </button>
          <button type="button" class="tool-button" id="grid-toggle" aria-pressed="true" aria-label="격자선" title="격자선 (G)" aria-keyshortcuts="G">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg>
          </button>
          <button type="button" class="tool-button" id="clear" aria-label="전체 지우기" title="전체 지우기" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
            <span class="button-label">전체 지우기</span>
          </button>
        </div>
      </div>

      <div class="workspace">
        <div class="canvas show-grid" id="canvas" tabindex="0" role="application" aria-label="16×16 그림판" aria-describedby="controls-hint"></div>

        <div class="side">
          <div class="current-color">
            <span class="current-swatch" id="current-swatch" aria-hidden="true"></span>
            <span class="current-text">현재 색 <strong id="current-name">검정</strong></span>
          </div>

          <div class="palette" id="palette" role="group" aria-label="색상 팔레트">
            <label class="swatch swatch-custom" id="custom-swatch" title="사용자 색 고르기">
              <span class="swatch-custom-mark" aria-hidden="true">+</span>
              <input type="color" class="custom-input" id="custom-color" value="#000000" aria-label="사용자 색 고르기">
            </label>
          </div>

          <div class="save-row">
            <label class="scale-field">
              <span class="scale-label">크기</span>
              <select class="select" id="scale">
                <option value="1">×1 (16px)</option>
                <option value="8">×8 (128px)</option>
                <option value="16" selected>×16 (256px)</option>
                <option value="32">×32 (512px)</option>
              </select>
            </label>
            <button type="button" class="button-primary" id="save">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
              PNG 저장
            </button>
          </div>
        </div>
      </div>
      <noscript>
        <p class="hint">이 그림판은 JavaScript가 켜져 있어야 쓸 수 있어요.</p>
      </noscript>
    </main>

    <footer class="app-footer">
      <p id="controls-hint">방향키로 이동, Space로 칠하기, Shift+방향키로 이어 칠하기</p>
    </footer>
  </div>

  <dialog class="confirm-dialog" id="clear-dialog" aria-labelledby="clear-dialog-title">
    <form method="dialog" class="confirm-form">
      <p class="confirm-title" id="clear-dialog-title">그림을 모두 지울까요?</p>
      <p class="confirm-detail">되돌리기로 다시 살릴 수 있어요.</p>
      <div class="confirm-actions">
        <button type="submit" class="tool-button" value="cancel" autofocus>취소</button>
        <button type="submit" class="tool-button confirm-button" value="confirm">모두 지우기</button>
      </div>
    </form>
  </dialog>

  <div class="visually-hidden" id="status" aria-live="polite"></div>
  <div class="visually-hidden" id="cursor-status" aria-live="polite"></div>
</body>
</html>
