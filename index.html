<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 블로그</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
  <script>
    // 첫 화면을 그리기 전에 저장된 테마를 적용해 깜빡임을 막는다
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="#/">나의 블로그</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="다크 모드로 전환">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="container site-main" tabindex="-1">
    <noscript>
      <p class="message">이 블로그는 JavaScript가 켜져 있어야 글을 보여줄 수 있어요.</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 나의 블로그</div>
  </footer>
</body>
</html>
